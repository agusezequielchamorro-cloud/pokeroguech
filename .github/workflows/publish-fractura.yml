name: Compilar PokéRogue Fractura para Android
on:
  push:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fractura-android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comprobar reglas y migración de Fractura
        run: node qa/validate-rules.mjs
      - name: Comprobar tipos
        run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          VITE_BYPASS_LOGIN: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: fractura-para-acode
          path: dist
          retention-days: 30
      - name: Preparar actualización pequeña para Acode
        run: |
          mkdir -p acode-update
          cp dist/index.html acode-update/index.html
          cp dist/asset-manifest.json acode-update/asset-manifest.json
          cp -R dist/assets acode-update/assets
      - uses: actions/upload-artifact@v4
        with:
          name: fractura-actualizacion-acode
          path: acode-update
          retention-days: 30
